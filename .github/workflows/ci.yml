name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Measures what consumers ship: the ES build minified and gzipped.
      # The limit matches the "< 7KB gzipped" claim in the README.
      - name: Check bundle size
        run: |
          SIZE=$(npx esbuild dist/index.mjs --minify --format=esm --log-level=error | gzip -c | wc -c | tr -d ' ')
          echo "Bundle size (minified + gzip): $SIZE bytes"
          if [ "$SIZE" -gt 6656 ]; then
            echo "::warning::Bundle size exceeds 6.5KB (minified + gzip): $SIZE bytes"
          fi
          if [ "$SIZE" -gt 7168 ]; then
            echo "::error::Bundle size exceeds the 7KB (minified + gzip) limit!"
            exit 1
          fi
          echo "✅ Bundle size is within limit"

      - name: Upload coverage reports
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
